services:
  datuvera-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datuvera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datuvera}
      POSTGRES_DB: ${POSTGRES_DB:-datuvera}
    volumes:
      - datuvera_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datuvera}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  datuvera-api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - APP_ENV=${APP_ENV}
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      datuvera-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2); sys.exit(0)\"" ]
      interval: 10s
      timeout: 3s
      retries: 5

  datuvera-web:
    build:
      context: ./web
      args:
        API_URL: ${API_URL:-http://datuvera-api:8000}
    ports:
      - "3001:3000"
    environment:
      API_URL: ${API_URL:-http://datuvera-api:8000}
    depends_on:
      datuvera-api:
        condition: service_healthy

  datuvera-demo-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - datuvera_demo_db_data:/var/lib/postgresql/data
      - ./docker/postgres/demo/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: datuvera_default

volumes:
  datuvera_db_data:
    name: ${DATUVERA_DB_VOLUME:-datuvera_db_data}
    external: ${DATUVERA_EXTERNAL_VOLUMES:-false}
  datuvera_demo_db_data:
    name: ${DATUVERA_DEMO_DB_VOLUME:-datuvera_demo_db_data}
    external: ${DATUVERA_EXTERNAL_VOLUMES:-false}
